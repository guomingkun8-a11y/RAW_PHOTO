services:
  redis:
    image: redis:7-alpine
    container_name: gmkraw-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: gmkraw-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmkraw:local
    container_name: gmkraw-local
    restart: unless-stopped
    depends_on:
      - redis
      - qdrant
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      IMAGE_TASK_QUEUE_ENABLED: "true"
      IMAGE_TASK_REDIS_URL: redis://redis:6379/0
      IMAGE_TASK_DATABASE_URL: sqlite:////app/data/image_tasks.db
      IMAGE_TASK_MAX_RETRIES: "2"
      IMAGE_TASK_TOTAL_CONCURRENCY: "8"
      IMAGE_TASK_WORKER_CONCURRENCY: "8"
      IMAGE_TASK_OWNER_CONCURRENCY: "2"
      AGENT_QUEUE_ENABLED: "true"
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_WORKER_CONCURRENCY: "4"
      AGENT_TOTAL_CONCURRENCY: "4"
      AGENT_OWNER_CONCURRENCY: "1"
      AGENT_OWNER_PENDING_LIMIT: "10"
      AGENT_MAX_RETRIES: "3"
      AGENT_RETRY_BASE_DELAY_SECS: "2"
      AGENT_RETRY_MAX_DELAY_SECS: "60"
      AGENT_DEAD_LETTER_RETENTION_SECS: "604800"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: raw_professional_memory
      QDRANT_FOLDER_COLLECTION: raw_professional_folder_assets
      QDRANT_KNOWLEDGE_COLLECTION: raw_professional_knowledge

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmkraw:local
    container_name: gmkraw-worker
    restart: unless-stopped
    command: ["uv", "run", "python", "worker.py"]
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      IMAGE_TASK_QUEUE_ENABLED: "true"
      IMAGE_TASK_REDIS_URL: redis://redis:6379/0
      IMAGE_TASK_DATABASE_URL: sqlite:////app/data/image_tasks.db
      IMAGE_TASK_MAX_RETRIES: "2"

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmkraw:local
    container_name: gmkraw-agent-worker
    restart: unless-stopped
    command: ["uv", "run", "python", "agent_worker.py"]
    depends_on:
      - redis
      - qdrant
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      IMAGE_TASK_QUEUE_ENABLED: "true"
      IMAGE_TASK_REDIS_URL: redis://redis:6379/0
      IMAGE_TASK_DATABASE_URL: sqlite:////app/data/image_tasks.db
      AGENT_QUEUE_ENABLED: "true"
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_WORKER_CONCURRENCY: "4"
      AGENT_TOTAL_CONCURRENCY: "4"
      AGENT_OWNER_CONCURRENCY: "1"
      AGENT_OWNER_PENDING_LIMIT: "10"
      AGENT_MAX_RETRIES: "3"
      AGENT_RETRY_BASE_DELAY_SECS: "2"
      AGENT_RETRY_MAX_DELAY_SECS: "60"
      AGENT_DEAD_LETTER_RETENTION_SECS: "604800"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: raw_professional_memory
      QDRANT_FOLDER_COLLECTION: raw_professional_folder_assets
      QDRANT_KNOWLEDGE_COLLECTION: raw_professional_knowledge
    # 存储后端配置 (可选值: json, sqlite, postgres, git)
    # environment:
    #   STORAGE_BACKEND: json

    # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname
    #   DATABASE_URL: sqlite:////app/data/accounts.db

    # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
    #   GIT_REPO_URL: https://github.com/user/repo.git
    #   GIT_TOKEN: ghp_xxxxxxxxxxxx
    #   GIT_BRANCH: main
    #   GIT_FILE_PATH: accounts.json

    # 认证密钥 (可选，覆盖 config.json)
    #   GMKRAW_AUTH_KEY: your_secret_key

    # 基础 URL (可选)
    #   GMKRAW_BASE_URL: https://your-domain.com
